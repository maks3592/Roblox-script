<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Script for 3-2-1 Blast Off Simulator: instant teleportation to chests.">
    <title>Roblox Script - Teleport to Chests</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div id="nebula"></div>
    <canvas id="space" aria-hidden="true"></canvas>

    <button id="langButton" class="lang-btn" type="button" aria-label="Change language">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="langLabel">RU</span>
    </button>

    <main>
        <header class="hero">
            <div class="rocket" aria-hidden="true">🚀</div>
            <h1>Roblox Script</h1>
            <h2 class="tagline">Teleport to Chests</h2>
            <p class="subtitle" data-i18n="subtitle"></p>
        </header>

        <section class="card" id="download-container">
            <button id="downloadButton" class="download-btn" type="button">
                <span class="btn-label" data-i18n="download"></span>
            </button>

            <div id="progress-container" aria-live="polite">
                <div id="progress-track"><div id="progress-bar"></div></div>
                <div id="progress-text">0%</div>
            </div>
            <div id="done">
                <span id="checkmark">✔</span>
                <span id="smiley">😉</span>
            </div>

            <div class="or"><span data-i18n="or"></span></div>
            <pre id="loader"><code>loadstring(game:HttpGet("https://raw.githubusercontent.com/maks3592/Roblox-script/main/script.lua", true))()</code></pre>
            <button id="copyButton" class="download-btn secondary" type="button" data-i18n="copy"></button>
        </section>

        <div class="grid">
            <section class="card">
                <h3 data-i18n="featuresTitle"></h3>
                <ul class="features">
                    <li data-i18n="f1"></li>
                    <li data-i18n="f2"></li>
                    <li data-i18n="f3"></li>
                    <li data-i18n="f4"></li>
                </ul>
            </section>

            <section class="card">
                <h3 data-i18n="howTitle"></h3>
                <ol class="steps">
                    <li data-i18n="s1"></li>
                    <li data-i18n="s2"></li>
                    <li data-i18n="s3"></li>
                </ol>
            </section>
        </div>

        <footer>
            <a href="https://github.com/maks3592/Roblox-script" target="_blank" rel="noopener">GitHub</a> ·
            <a href="https://github.com/maks3592/Roblox-script/releases" target="_blank" rel="noopener">Releases</a> ·
            <span data-i18n="author"></span> <a href="https://github.com/maks3592" target="_blank" rel="noopener">maks3592</a>
            <p class="hint" data-i18n="risk"></p>
        </footer>
    </main>

    <div id="message-box" role="dialog" aria-modal="true">
        <p id="message-text"></p>
        <button id="close-message" type="button" aria-label="Close">✖</button>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
